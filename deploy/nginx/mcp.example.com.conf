# MISSIRIA RC Connector — nginx vhost
# certbot --nginx adds the TLS block; keep this file as the HTTP origin.
upstream rc_connector_mcp {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    access_log /var/log/nginx/mcp.example.com.access.log;
    error_log  /var/log/nginx/mcp.example.com.error.log;

    # Discovery, OAuth and MCP are the only public paths.
    location ~ ^/(mcp|oauth/|\.well-known/|healthz) {
        proxy_pass http://rc_connector_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events: no buffering, long timeouts
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        chunked_transfer_encoding on;

        client_max_body_size 25m;   # attachments on send_message
    }

    # Internal API must never be reachable from outside.
    location ^~ /internal/ { return 404; }

    location / { return 404; }
}
